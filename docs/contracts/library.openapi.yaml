openapi: 3.1.0
info:
  title: Script Maker Library API
  version: 1.0.0
  description: Proposed contract; server implementation is pending. See README.md for client coverage and persistence rules.
servers:
  - url: http://localhost:8000
paths:
  /stories:
    get:
      operationId: listStories
      responses:
        '200':
          description: Saved stories, newest first
          content:
            application/json:
              schema:
                type: object
                required: [stories]
                properties:
                  stories:
                    type: array
                    items:
                      $ref: './library-story.schema.json'
    post:
      operationId: addStory
      requestBody:
        $ref: '#/components/requestBodies/Story'
      responses:
        '201':
          $ref: '#/components/responses/Story'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteStories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string, minLength: 1}
      responses:
        '200':
          description: All specified stories deleted atomically
          content:
            application/json:
              schema:
                type: object
                required: [deletedIds]
                properties:
                  deletedIds:
                    type: array
                    items: {type: string}
        default:
          $ref: '#/components/responses/Error'
  /stories/{id}:
    parameters:
      - $ref: '#/components/parameters/StoryID'
    patch:
      operationId: updateStory
      description: Save a full snapshot. Preserve identity and creation time; reject a route/body ID mismatch.
      requestBody:
        $ref: '#/components/requestBodies/Story'
      responses:
        '200':
          $ref: '#/components/responses/Story'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteStory
      responses:
        '204': {description: Story deleted}
        default:
          $ref: '#/components/responses/Error'
  /stories/{id}/updates/{kind}:
    parameters:
      - $ref: '#/components/parameters/StoryID'
      - name: kind
        in: path
        required: true
        schema: {type: string, enum: [hashtags, images, news]}
    post:
      operationId: enrichStory
      description: Return only the requested result field. Retain all other story fields. None disables AI but permits source/media retrieval.
      requestBody:
        $ref: '#/components/requestBodies/LibraryRequest'
      responses:
        '200':
          $ref: '#/components/responses/LibraryResult'
        default:
          $ref: '#/components/responses/Error'
  /stories/{id}/refinements:
    parameters:
      - $ref: '#/components/parameters/StoryID'
    post:
      operationId: refineScript
      description: Return a script preview without saving it. Reject None or a blank instruction with HTTP 422. Acceptance is a separate story update.
      requestBody:
        $ref: '#/components/requestBodies/LibraryRequest'
      responses:
        '200':
          $ref: '#/components/responses/LibraryResult'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    StoryID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
  requestBodies:
    Story:
      required: true
      content:
        application/json:
          schema:
            $ref: './library-story.schema.json'
    LibraryRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: './library-request.schema.json'
  responses:
    Story:
      description: Persisted Story
      content:
        application/json:
          schema:
            $ref: './library-story.schema.json'
    LibraryResult:
      description: Replacement enrichment data or a refinement preview
      content:
        application/json:
          schema:
            $ref: './library-result.schema.json'
    Error:
      description: Failed operation; existing story data remains intact
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: {type: string}
                  message: {type: string}
