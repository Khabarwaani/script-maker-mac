name: Release

# Releases go out ONLY by tag push (v*) — never created manually.
# Tag vX.Y.Z on the main merge commit after the release PR merges.
on:
  push:
    tags:
      - 'v*'

jobs:
  build-dmg:
    runs-on: macos-latest
    permissions:
      contents: write # create releases + upload assets
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/mac/build_dmg.sh "$VERSION"
          ls -la packaging/mac/ScriptMakerMac-*.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          DMG="$(ls packaging/mac/ScriptMakerMac-*.dmg | head -1)"
          if [ -z "$DMG" ]; then
            echo "ERROR: no DMG found in packaging/mac/." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading DMG asset."
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" \
              --title "Script Maker $TAG" \
              --generate-notes \
              "$DMG"
          fi

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name' | grep -q '\.dmg$' \
            && echo "DMG attached OK" \
            || { echo "ERROR: no DMG asset on release $GITHUB_REF_NAME." >&2; exit 1; }
