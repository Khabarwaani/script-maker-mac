name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test (Debug)
        run: |
          xcodebuild -scheme ScriptMakerMac \
            -destination 'platform=macOS' \
            -configuration Debug \
            test
