name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (Debug)
        run: |
          xcodebuild -project ScriptMakerMac.xcodeproj \
            -scheme ScriptMakerMac \
            -configuration Debug \
            test
